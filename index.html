<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>Rock Paper Scissors!</title>
</head>
<body>

    <div class="content">
        <div class="header">
Rock Paper Scissors
        </div>
        <div id="game">
            <div id="playerSign">
                ❔
            </div>

            <div id="computerSign">
                ❔
            </div>
        </div>
        <div class="buttons">
            <button id="rockbtn" type="button">✊</button>
            <button id="paperbtn" type="button">✋</button>
            <button id="scissorsbtn" type="button">✌️</button>
        </div>
    </div>
    <script>

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function getComputerChoice(){
            switch(getRandomInt(3)){
                case 0:
                    return "rock"
                case 1:
                    return "paper"
                case 2:
                    return "scissors"
            }
        }

        function compare(PlayerChoice, ComputerChoice) {
            var result = (map[PlayerChoice] || {})[ComputerChoice] || "Invalid choice";

            if (result === "Was a tie") {
                return { winner: 0, message: result };
            }

            if (result.startsWith(PlayerChoice)) {
                return { winner: 1, message: result };
            }

            return { winner: 2, message: result };
        }

        function handleClick(PlayerChoice){
            const playerSign = document.getElementById("playerSign")
            playerSign.textContent = "✊"
            
            const ComputerChoice = getComputerChoice()
                alert(`The computer chose ${ComputerChoice}`)
                let result = compare(PlayerChoice, ComputerChoice)
                switch(result.winner){
                    case 0:
                        alert("It's a tie")
                        return "tie"
                    case 1:
                        alert("You won the round")
                        return "player"
                    case 2:
                        alert("You lost the round")
                        return "computer"
                }

            }

        let rockbtn = document.getElementById("rockbtn");
        let paperbtn = document.getElementById("paperbtn");
        let scissorsbtn = document.getElementById("scissorsbtn");


        rockbtn.addEventListener('click', () => handleClick("rock"));
        paperbtn.addEventListener('click', () => handleClick("paper"));
        scissorsbtn.addEventListener('click', () => handleClick("scissors"));

        const valid_answers = ["rock" , "paper" , "scissors"]
        var map = {}

        let PlayerPoints = 0
        let ComputerPoints = 0

        valid_answers.forEach(function(choice, i) {
        map[choice] = {};
        map[choice][choice] = "Was a tie"
        map[choice][valid_answers[(i+1)%3]] = valid_answers[(i+1)%3] + " wins"
        map[choice][valid_answers[(i+2)%3]] = choice + " wins"
        })

                ComputerPoints += 1
            }
        }

        if (PlayerPoints > ComputerPoints){
            GameResult = "You win the game!"
        } else if (ComputerPoints > PlayerPoints){
            GameResult = "The computer won the game!"
        } else GameResult = "It's a tie!"
        
        alert(GameResult)
*/
    </script>
</body>
</html>
