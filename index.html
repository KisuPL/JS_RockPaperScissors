<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="js-file.js" defer></script>
    <title>Rock Paper Scissors!</title>
</head>
<body>

    <div class="content">
        <div class="header">
Rock Paper Scissors
        </div>
        <div class="scoreboard">
                <h1 id="scoreInfo">
                    Choose your weapon
                </h1>
                <h2 id="scoreMessage">
                    First to score 5 points wins the game
                </h2>
            <div id="scoresContainer">
                <div class="scoreBox">
                    <div class="playerSign" id="playerSign">
                        ❔
                    </div>
                    <p class="score" id="playerScore">Player: 0</p>
                </div>
                <div class="scoreBox">
                    <div class="playerSign" id="computerSign">
                        ❔
                    </div>
                    <p class="score" id="computerScore">Computer: 0</p>
                </div>
            </div>
        </div>
        <div class="buttons">
            <button id="rockbtn" type="button">✊</button>
            <button id="paperbtn" type="button">✋</button>
            <button id="scissorsbtn" type="button">✌️</button>
        </div>
    </div>

</body>
</html>
